{{ define "main" }}
<section class="article-sheet">
  <header class="article-kicker">
    <a href="{{ .Site.Home.RelPermalink }}">← bolab.dev</a>
    <span>TOOLS</span>
  </header>
  <div class="reader-body">
    <h1>{{ .Title }}</h1>
    <p>{{ .Description }}</p>
  </div>
  <div class="tool-board">
    <a class="inv-arch-card" href="/tools/btc/">
      <span>
        <b>BTC Dashboard</b><br>
        <small>{{ if eq .Lang "zh-cn" }}比特币实时看板{{ else }}Bitcoin telemetry{{ end }}</small>
      </span>
      <span>↗</span>
    </a>
  </div>
</section>
{{ end }}
