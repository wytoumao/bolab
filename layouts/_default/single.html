{{ define "main" }}
<article class="article-sheet">
  <header class="article-kicker">
    <a href="{{ .Site.Home.RelPermalink }}">← bolab.dev</a>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Params.categories }}<span>{{ delimit . " · " }}</span>{{ end }}
  </header>
  <div class="reader-body">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </div>
</article>
{{ end }}
