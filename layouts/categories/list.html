{{ define "main" }}
<section class="article-sheet">
  <header class="article-kicker">
    <a href="{{ .Site.Home.RelPermalink }}">← bolab.dev</a>
    <span>{{ .Title }}</span>
  </header>
  <div class="dir-section">
    {{ range where (where .Pages "Params.unlisted" "!=" true) "Params.private" "!=" true }}
    <a class="dir-row" href="{{ .RelPermalink }}">
      <span class="d-date">{{ .Date.Format "2006-01-02" }}</span>
      <span class="d-title">{{ .Title }}</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
